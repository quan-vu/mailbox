[package]
name = "mailbox-mime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bounded MIME parsing and allow-list HTML sanitising for received mail. Native targets only."

[dependencies]
mailbox-core = { path = "../mailbox-core" }
# Pinned exactly: both parse hostile input. Upgrades need the hostile corpus re-run (DEPENDENCIES.md).
mail-parser = { version = "=0.11.9", default-features = false, features = ["full_encoding"] }
ammonia = "=4.2.5"
